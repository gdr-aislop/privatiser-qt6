name: Build Windows EXE

on:
  push:
    branches:
      - main
      - "claude/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Derive version ──────────────────────────────────────────────────────
      - name: Set version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            SHORT=$(git rev-parse --short HEAD)
            echo "version=0.0.0-git${SHORT}" >> "$GITHUB_OUTPUT"
          fi

      # ── Python deps ─────────────────────────────────────────────────────────
      - name: Install Python packages
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet PyQt6 privatiser pyinstaller pillow

      # ── Build ───────────────────────────────────────────────────────────────
      - name: Build EXE
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python packaging/build-windows.py

      # ── Verify ─────────────────────────────────────────────────────────────
      - name: Verify EXE exists
        shell: pwsh
        run: Get-ChildItem Privatiser-*.exe | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      # ── Upload artifact ─────────────────────────────────────────────────────
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: privatiser-windows-exe
          path: Privatiser-*.exe
          if-no-files-found: error
          retention-days: 30

      # ── Publish to GitHub Release on version tags ───────────────────────────
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Privatiser-*.exe
          generate_release_notes: false
