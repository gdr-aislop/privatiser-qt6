name: Build .deb package

on:
  push:
    branches:
      - main
      - "claude/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Derive a sensible package version ─────────────────────────────────
      - name: Set version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            SHORT=$(git rev-parse --short HEAD)
            echo "version=0.0.0~git${SHORT}" >> "$GITHUB_OUTPUT"
          fi

      # ── System dependencies ────────────────────────────────────────────────
      # libxcb-cursor0 and libgl1 are runtime deps for Qt on Ubuntu 24.04;
      # patchelf is needed by PyInstaller to rewrite rpath entries.
      - name: Install system build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3-dev \
            python3-pip \
            binutils \
            patchelf \
            libxcb-cursor0 \
            libxcb1 \
            libx11-6 \
            libgl1

      # ── Python dependencies ────────────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # ── Bundle with PyInstaller ────────────────────────────────────────────
      # --onedir produces a directory bundle (more reliable than --onefile
      # for Qt apps because Qt's platform plugin loader expects relative paths).
      # --collect-all PyQt6 ensures platform plugins and translations are
      # included; without it the app silently fails to open a window.
      - name: Build with PyInstaller
        run: |
          pyinstaller \
            --name privatiser \
            --onedir \
            --windowed \
            --collect-all PyQt6 \
            main.py

      # ── Sanity-check the binary before packaging ───────────────────────────
      - name: Verify binary
        run: |
          test -f dist/privatiser/privatiser
          file dist/privatiser/privatiser | grep -q "ELF 64-bit"
          echo "Binary OK"

      # ── Assemble .deb ──────────────────────────────────────────────────────
      - name: Assemble .deb
        id: deb
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PKG="privatiser_${VERSION}_amd64"

          install -d "${PKG}/DEBIAN"
          install -d "${PKG}/usr/lib/privatiser"
          install -d "${PKG}/usr/bin"
          install -d "${PKG}/usr/share/applications"
          install -d "${PKG}/usr/share/doc/privatiser"

          # PyInstaller bundle
          cp -r dist/privatiser/. "${PKG}/usr/lib/privatiser/"

          # Thin launcher so `privatiser` is on $PATH
          cat > "${PKG}/usr/bin/privatiser" <<'LAUNCHER'
          #!/bin/sh
          exec /usr/lib/privatiser/privatiser "$@"
          LAUNCHER
          chmod 755 "${PKG}/usr/bin/privatiser"

          # .desktop entry for application menus
          cat > "${PKG}/usr/share/applications/privatiser.desktop" <<'DESKTOP'
          [Desktop Entry]
          Name=Privatiser
          Comment=Anonymize sensitive data in text — runs fully locally
          Exec=/usr/lib/privatiser/privatiser
          Icon=privatiser
          Type=Application
          Categories=Utility;Security;
          Terminal=false
          StartupWMClass=privatiser
          DESKTOP

          # Minimal copyright notice required by Debian policy
          cat > "${PKG}/usr/share/doc/privatiser/copyright" <<'CR'
          Privatiser desktop GUI
          MIT License — see https://privatiser.net
          CR

          # control file — Installed-Size must be in kibibytes
          INSTALLED_SIZE=$(du -sk "${PKG}/usr" | cut -f1)
          cat > "${PKG}/DEBIAN/control" <<EOF
          Package: privatiser
          Version: ${VERSION}
          Architecture: amd64
          Maintainer: Privatiser <info@privatiser.net>
          Installed-Size: ${INSTALLED_SIZE}
          Depends: libxcb-cursor0, libgl1
          Section: utils
          Priority: optional
          Description: Privatiser — text anonymization desktop GUI
           Anonymizes IPs, API keys, secrets, PII, and cloud identifiers
           from any text. Fully reversible. Everything runs locally —
           nothing leaves the machine.
          EOF

          dpkg-deb --build --root-owner-group "${PKG}"
          echo "deb=${PKG}.deb" >> "$GITHUB_OUTPUT"

      # ── Verify the .deb is well-formed ─────────────────────────────────────
      - name: Inspect .deb
        run: dpkg-deb --info "${{ steps.deb.outputs.deb }}"

      # ── Upload artifact ────────────────────────────────────────────────────
      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: privatiser-deb-ubuntu2404
          path: "*.deb"
          if-no-files-found: error
          retention-days: 30

      # ── Create GitHub Release on version tags ──────────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.deb"
          generate_release_notes: true
