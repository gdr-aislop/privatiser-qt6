name: Build .deb package

on:
  push:
    branches:
      - main
      - "claude/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Derive a sensible package version ─────────────────────────────────
      - name: Set version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            SHORT=$(git rev-parse --short HEAD)
            echo "version=0.0.0~git${SHORT}" >> "$GITHUB_OUTPUT"
          fi

      # ── System build tools only — no PyQt6 here, that's a runtime dep ─────
      - name: Install system build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3-pip \
            python3-venv

      # ── Vendor the privatiser library ──────────────────────────────────────
      # PyQt6 is available as the system package python3-pyqt6 and is declared
      # as a Depends, so we do NOT vendor it. Only privatiser (PyPI-only) needs
      # to be shipped inside the .deb.
      - name: Vendor privatiser into package tree
        run: |
          pip install \
            --target vendor \
            --no-compile \
            privatiser

          # Drop bytecode and dist-info cruft to keep the package lean
          find vendor -name "*.pyc" -delete
          find vendor -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          find vendor -name "*.dist-info" -type d -exec rm -rf {} + 2>/dev/null || true

      # ── Assemble .deb ──────────────────────────────────────────────────────
      - name: Assemble .deb
        id: deb
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Pure-Python package → architecture: all
          PKG="privatiser_${VERSION}_all"

          install -d "${PKG}/DEBIAN"
          install -d "${PKG}/usr/share/privatiser"
          install -d "${PKG}/usr/share/privatiser/vendor"
          install -d "${PKG}/usr/bin"
          install -d "${PKG}/usr/share/applications"
          install -d "${PKG}/usr/share/doc/privatiser"

          # Application source
          install -m 644 main.py "${PKG}/usr/share/privatiser/"

          # Vendored privatiser library (only this; PyQt6 comes from the system)
          cp -r vendor/. "${PKG}/usr/share/privatiser/vendor/"

          # Launcher — prepend vendor dir so privatiser is importable,
          # then hand off to the system python3 and system PyQt6
          cat > "${PKG}/usr/bin/privatiser" <<'LAUNCHER'
#!/bin/sh
PYTHONPATH=/usr/share/privatiser/vendor${PYTHONPATH:+:$PYTHONPATH}
export PYTHONPATH
exec python3 /usr/share/privatiser/main.py "$@"
LAUNCHER
          chmod 755 "${PKG}/usr/bin/privatiser"

          # .desktop entry for application menus
          cat > "${PKG}/usr/share/applications/privatiser.desktop" <<'DESKTOP'
[Desktop Entry]
Name=Privatiser
Comment=Anonymize sensitive data in text — runs fully locally
Exec=privatiser
Icon=privatiser
Type=Application
Categories=Utility;Security;
Terminal=false
StartupWMClass=privatiser
DESKTOP

          # Minimal copyright notice required by Debian policy
          cat > "${PKG}/usr/share/doc/privatiser/copyright" <<'CR'
Privatiser desktop GUI
MIT License — see https://privatiser.net
CR

          # control — Installed-Size in kibibytes; arch:all; system deps only
          INSTALLED_SIZE=$(du -sk "${PKG}/usr" | cut -f1)
          cat > "${PKG}/DEBIAN/control" <<EOF
Package: privatiser
Version: ${VERSION}
Architecture: all
Maintainer: Privatiser <info@privatiser.net>
Installed-Size: ${INSTALLED_SIZE}
Depends: python3 (>= 3.10), python3-pyqt6
Section: utils
Priority: optional
Description: Privatiser — text anonymization desktop GUI
 Anonymizes IPs, API keys, secrets, PII, and cloud identifiers
 from any text. Fully reversible. Everything runs locally —
 nothing leaves the machine.
EOF

          dpkg-deb --build --root-owner-group "${PKG}"
          echo "deb=${PKG}.deb" >> "$GITHUB_OUTPUT"

      # ── Verify the .deb is well-formed ─────────────────────────────────────
      - name: Inspect .deb
        run: dpkg-deb --info "${{ steps.deb.outputs.deb }}"

      # ── Smoke-test: install the .deb and check the launcher is present ─────
      - name: Install and smoke-test .deb
        run: |
          sudo apt-get install -y python3-pyqt6
          sudo dpkg -i "${{ steps.deb.outputs.deb }}"
          test -x /usr/bin/privatiser
          python3 -c "
          import sys
          sys.path.insert(0, '/usr/share/privatiser/vendor')
          from privatiser import Privatiser
          p = Privatiser()
          result, mapping = p.anonymize('ip=192.168.1.1 pass=secret')
          assert mapping, 'Expected replacements, got none'
          print('Smoke test OK —', len(mapping), 'replacements')
          "

      # ── Upload artifact ────────────────────────────────────────────────────
      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: privatiser-deb-ubuntu2404
          path: "*.deb"
          if-no-files-found: error
          retention-days: 30

      # ── Create GitHub Release on version tags ──────────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.deb"
          generate_release_notes: true
