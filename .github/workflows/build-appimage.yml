name: Build AppImage

on:
  push:
    branches:
      - main
      - "claude/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Derive version ─────────────────────────────────────────────────────
      - name: Set version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            SHORT=$(git rev-parse --short HEAD)
            echo "version=0.0.0~git${SHORT}" >> "$GITHUB_OUTPUT"
          fi

      # ── Install system deps ────────────────────────────────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            binutils patchelf imagemagick zsync \
            libxcb-cursor0 libxcb1 libx11-6 libgl1 libglib2.0-0 \
            python3-venv

      # ── Python deps in a venv ──────────────────────────────────────────────
      - name: Install Python packages
        run: |
          python3 -m venv /opt/build-venv
          /opt/build-venv/bin/pip install --quiet --upgrade pip
          /opt/build-venv/bin/pip install --quiet PyQt6 privatiser pyinstaller

      # ── Build ──────────────────────────────────────────────────────────────
      - name: Build AppImage
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PY: /opt/build-venv/bin/python3
          PYINSTALLER: /opt/build-venv/bin/pyinstaller
        run: bash packaging/build-appimage.sh

      # ── Verify ────────────────────────────────────────────────────────────
      - name: Verify AppImage exists
        run: |
          ls -lh Privatiser-*.AppImage Privatiser-*.AppImage.zsync
          file Privatiser-*.AppImage | grep -q "ELF\|executable"

      # ── Upload artifact ───────────────────────────────────────────────────
      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: privatiser-appimage
          path: |
            Privatiser-*.AppImage
            Privatiser-*.AppImage.zsync
          if-no-files-found: error
          retention-days: 30

      # ── Publish to GitHub Release on version tags ─────────────────────────
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Privatiser-*.AppImage
            Privatiser-*.AppImage.zsync
          generate_release_notes: false
