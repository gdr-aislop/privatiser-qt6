name: Build AppImage

on:
  push:
    branches:
      - main
      - "claude/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Derive version ─────────────────────────────────────────────────────
      - name: Set version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            SHORT=$(git rev-parse --short HEAD)
            echo "version=0.0.0~git${SHORT}" >> "$GITHUB_OUTPUT"
          fi

      # ── Build inside Ubuntu 20.04 for glibc 2.31 compatibility ────────────
      # The host runner is ubuntu-24.04 so GitHub Actions tooling works fine;
      # only the Python/PyInstaller/AppImage build runs inside the container.
      - name: Build AppImage (ubuntu:20.04 container)
        run: |
          docker run --rm \
            -e VERSION="${{ steps.version.outputs.version }}" \
            -v "${PWD}:/workspace" \
            -w /workspace \
            ubuntu:20.04 \
            bash packaging/build-appimage.sh

      # ── Verify ────────────────────────────────────────────────────────────
      - name: Verify AppImage exists
        run: |
          ls -lh Privatiser-*.AppImage
          file Privatiser-*.AppImage | grep -q "ELF\|executable"

      # ── Upload artifact ───────────────────────────────────────────────────
      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: privatiser-appimage
          path: "Privatiser-*.AppImage"
          if-no-files-found: error
          retention-days: 30

      # ── Publish to GitHub Release on version tags ─────────────────────────
      # softprops/action-gh-release will create the release if it doesn't
      # exist yet, or add this file to it if the .deb workflow got there first.
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "Privatiser-*.AppImage"
          generate_release_notes: false
